[project]
name = "zoubek"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ssavutu", email = "ssavutu@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle>=3.3.1",
    "pdf2image>=1.17.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.150",
]

[project.scripts]
zoubek = "zoubek.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
